name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: php -l on every PHP file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status
      - name: SEO checks (title/description lengths, link rewrite)
        run: php tests/php/seo-test.php
      - name: Requirement checks have a field on their template
        run: php tests/php/requirements-test.php
      - name: Deploy helper (staged swap, removals, roll back, webhook signature)
        run: php tests/php/deploy-test.php
      - name: 1.3.7 content patches apply to the live page text
        run: php tests/php/v137-test.php
      - name: 1.3.9 CSP report-only header
        run: php tests/php/v139-test.php
      - name: 1.4.0 privacy patches and currency list
        run: php tests/php/v140-test.php
      - name: 1.4.1 refund template, form keys and donation FAQ patch
        run: php tests/php/v141-test.php

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: for f in wp-content/themes/receiptgenpro/assets/js/*.js; do node --check "$f"; done
      - name: Lint (eslint.config.js)
        run: npx --yes eslint@9.39.5 wp-content/themes/receiptgenpro/assets/js/
      - name: Install jsdom for the DOM tests
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Unit and DOM tests (generator, verify and widget)
        env:
          RF_REQUIRE_JSDOM: '1'
        run: node --test tests/*.test.js
