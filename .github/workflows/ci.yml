name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: php -l on every PHP file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: for f in wp-content/themes/receiptgenpro/assets/js/*.js; do node --check "$f"; done
      - name: Unit tests (money and amount-in-words helpers)
        run: node --test tests/*.test.js
